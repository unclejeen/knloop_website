name: Release (Linux + Windows + Android, built from unclejeen/knloop)

# The public release host [knloop ADR-0103]. The private source is checked out with
# KNLOOP_READ_TOKEN; the app's updater endpoint is
#   https://github.com/unclejeen/knloop_website/releases/latest/download/latest.json
# so every release must carry latest.json, and that manifest must list every
# platform the updater serves (windows-x86_64). Linux and Android have no
# updater entry: their packages are just release assets.
#
# REQUIRED SECRETS (see knloop docs/packaging.md section 3):
#   KNLOOP_READ_TOKEN            fine-grained PAT, Contents:Read on unclejeen/knloop
#   TAURI_SIGNING_PRIVATE_KEY    base64 content of ~/.tauri/knloop.key (in-app updates)
#   TAURI_KEY_PASSWORD           that key's password
# Optional, Android (the job enables itself when ANDROID_KEYSTORE_BASE64 exists):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Microsoft Store MSIX (built on EVERY run; these repository VARIABLES make it submittable -
# without them the package carries the development identity and cannot be submitted):
#   MSSTORE_IDENTITY_NAME, MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY_NAME, MSSTORE_DISPLAY_NAME
# Optional, Windows Authenticode (unsigned builds still publish):
#   WINDOWS_CODE_SIGNING_CERTIFICATE, WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD
# Optional, telemetry: VITE_SENTRY_DSN, SENTRY_DSN, VITE_POSTHOG_KEY, VITE_POSTHOG_HOST

on:
  workflow_dispatch:
    inputs:
      ref:
        description: knloop ref to build (branch, tag or commit SHA)
        required: false
        default: main
  repository_dispatch:
    types: [knloop-release]

permissions:
  contents: write

concurrency:
  group: release-knloop
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: unclejeen/knloop
  SOURCE_REF: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # ── one version for every platform ────────────────────────────────────────────
  version:
    name: Compute the release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ci.outputs.version }}
      tag: ${{ steps.ci.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.KNLOOP_READ_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Derive <package version>-<commit count>
        id: ci
        run: node scripts/release-version.mjs ci github | tee -a "$GITHUB_OUTPUT"

  # ── linux x86_64: deb, rpm ──────────────────────────────────────────
  build-linux:
    name: Build (linux-x86_64)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.KNLOOP_READ_TOKEN }}

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev fcitx5-frontend-gtk3 libfuse2 librsvg2-dev curl wget \
            patchelf build-essential file cpio rpm jq

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { targets: x86_64-unknown-linux-gnu }
      - run: pnpm install --frozen-lockfile

      - name: Clear cached bundle artifacts
        # The Rust target dir is cached, so a previous run's bundle/ survives and its
        # installers get uploaded next to this run's (that is how 0.1.0-863 shipped
        # alongside 0.1.0-865 on 2026-10-01).
        run: rm -rf src-tauri/target/x86_64-unknown-linux-gnu/release/bundle

      - name: Set version
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

      - name: Verify the updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY//[[:space:]]/}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty in this repository (see the header of this workflow)."
            exit 1
          fi
          probe="$(mktemp)"; printf 'knloop updater key probe\n' > "$probe"
          pnpm tauri signer sign "$probe" || { echo "::error::updater key rejected: wrong TAURI_KEY_PASSWORD or wrong key content"; exit 1; }
          rm -f "$probe" "$probe.sig"

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: pnpm tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm

      - name: Normalize bundle names
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          BUNDLE=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          canonicalize() {
            local src; src=$(find "$BUNDLE/$1" -maxdepth 1 -name "$2" -print -quit)
            [ -n "$src" ] || { echo "::error::no $2 under $BUNDLE/$1"; exit 1; }
            if [ "$(basename "$src")" != "$3" ]; then
              mv "$src" "$BUNDLE/$1/$3"
              [ -f "$src.sig" ] && mv "$src.sig" "$BUNDLE/$1/$3.sig"
            fi
          }

          canonicalize deb      '*.deb'             "knloop_${VERSION}_linux-amd64.deb"
          canonicalize rpm      '*.rpm'             "knloop_${VERSION}_linux-x86_64.rpm"
          ls -1 "$BUNDLE/deb" "$BUNDLE/rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          if-no-files-found: error
          retention-days: 1
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig

  # ── windows x86_64: NSIS installer (Authenticode only when the secrets exist) ──
  build-windows:
    name: Build (windows-x86_64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.KNLOOP_READ_TOKEN }}

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { targets: x86_64-pc-windows-msvc }
      - uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-release-cargo-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-cargo-x86_64-pc-windows-msvc-
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: ${{ runner.os }}-tauri-tools-nsis-3.11-nsis-tauri-utils-0.5.3

      - name: Prefetch the NSIS toolchain
        shell: pwsh
        run: ./.github/scripts/prefetch-tauri-nsis.ps1

      - run: pnpm install --frozen-lockfile

      - name: Clear cached bundle artifacts
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"

      - name: Set version
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $tauri = Get-Content "src-tauri/tauri.conf.json" | ConvertFrom-Json
          $tauri.version = $version
          $tauri | ConvertTo-Json -Depth 100 | Set-Content "src-tauri/tauri.conf.json"
          (Get-Content "src-tauri/Cargo.toml") -replace '^version = ".*"$', "version = `"$version`"" | Set-Content "src-tauri/Cargo.toml"

      - name: Verify the updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY//[[:space:]]/}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty in this repository (see the header of this workflow)."
            exit 1
          fi
          probe="$(mktemp)"; printf 'knloop updater key probe\n' > "$probe"
          pnpm tauri signer sign "$probe" || { echo "::error::updater key rejected: wrong TAURI_KEY_PASSWORD or wrong key content"; exit 1; }
          rm -f "$probe" "$probe.sig"

      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Normalize the installer name
        # knloop_<version>_windows-x64-setup.exe [ADR-0104]; the NSIS bundler writes
        # knloop_<version>_x64-setup.exe, and the updater .sig must follow it.
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $dir = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis"
          Get-ChildItem $dir -Filter "*-setup.exe" | ForEach-Object {
            $target = Join-Path $dir "knloop_${version}_windows-x64-setup.exe"
            $sig = "$($_.FullName).sig"
            if ($_.FullName -ne $target) { Move-Item $_.FullName $target -Force }
            if (Test-Path $sig) { Move-Item $sig "$target.sig" -Force }
          }
          Get-ChildItem $dir | ForEach-Object { $_.Name }
      # ── Microsoft Store: an unsigned MSIX off the binary this job just built ──────
      # knloop ADR-0305. The Store accepts MSIX for the "MSIX app" product type and
      # re-signs it, so no code-signing certificate is needed. Built on EVERY run:
      # the identity falls back to the development values when the MSSTORE_*
      # repository VARIABLES are unset, and the step warns that Partner Center will
      # reject such a package - it validates the identity it reserved. A release
      # therefore always carries the artifact; nothing here skips.
      - name: Build the Microsoft Store MSIX
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME || 'com.knloop.app' }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER || 'CN=knloop' }}
          MSSTORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME || 'knloop' }}
          MSSTORE_DISPLAY_NAME: ${{ vars.MSSTORE_DISPLAY_NAME }}
          # Per-variable flags, not one combined boolean: the warning has to NAME the
          # variable that is missing. A combined flag sent someone to Partner Center to
          # read "PublisherDisplayName is knloop, the registered name is 影象限" when the
          # build log could have said "MSSTORE_PUBLISHER_DISPLAY_NAME is not set".
          MSSTORE_IDENTITY_NAME_SET: ${{ vars.MSSTORE_IDENTITY_NAME != '' }}
          MSSTORE_PUBLISHER_SET: ${{ vars.MSSTORE_PUBLISHER != '' }}
          MSSTORE_PUBLISHER_DISPLAY_NAME_SET: ${{ vars.MSSTORE_PUBLISHER_DISPLAY_NAME != '' }}
        run: |
          $missing = @()
          if ($env:MSSTORE_IDENTITY_NAME_SET -ne "true") { $missing += "MSSTORE_IDENTITY_NAME" }
          if ($env:MSSTORE_PUBLISHER_SET -ne "true") { $missing += "MSSTORE_PUBLISHER" }
          if ($env:MSSTORE_PUBLISHER_DISPLAY_NAME_SET -ne "true") { $missing += "MSSTORE_PUBLISHER_DISPLAY_NAME" }
          Write-Host "[msix] Identity Name        = $env:MSSTORE_IDENTITY_NAME"
          Write-Host "[msix] Identity Publisher   = $env:MSSTORE_PUBLISHER"
          Write-Host "[msix] PublisherDisplayName = $env:MSSTORE_PUBLISHER_DISPLAY_NAME"
          if ($missing.Count -gt 0) {
            Write-Host "::warning::repository variable(s) not set: $($missing -join ', '). This MSIX carries the DEVELOPMENT fallback for them, so Partner Center rejects it at upload, before certification: Identity/@Name must be a reserved app name ('The name found in the package is not one of your reserved app names'), Identity/@Publisher must be the account's CN=<GUID>, and PublisherDisplayName must match the registered name character for character. Set them from Partner Center -> Product management -> Product Identity (knloop docs/windows-packaging.md, section 7.2)."
          } else {
            Write-Host "[msix] Microsoft Store identity is fully configured."
          }
          $arguments = @{
            ReleaseVersion       = "${{ needs.version.outputs.version }}"
            IdentityName         = $env:MSSTORE_IDENTITY_NAME
            Publisher            = $env:MSSTORE_PUBLISHER
            PublisherDisplayName = $env:MSSTORE_PUBLISHER_DISPLAY_NAME
            TargetTriple         = "x86_64-pc-windows-msvc"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:MSSTORE_DISPLAY_NAME)) {
            $arguments.DisplayName = $env:MSSTORE_DISPLAY_NAME
          }
          ./scripts/msix/build-msix.ps1 @arguments

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          if-no-files-found: error
          retention-days: 1
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msix/*.msix

  # ── android arm64: runs by itself once the keystore secrets exist ──────────────
  build-android:
    name: Build (android-arm64)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - name: Is the Android signing key configured?
        id: guard
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64//[[:space:]]/}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 is not set, so the Android build is skipped. Generate a release keystore and add the four ANDROID_* secrets to switch it on (knloop docs/packaging.md, section 2.5)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.KNLOOP_READ_TOKEN }}
          fetch-depth: 0

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }

      - if: steps.guard.outputs.ready == 'true'
        name: Install the Android SDK command-line tools
        # No third-party action here: android-actions/setup-android failed on the
        # 2026-10-01 run (step 5) and its later steps never ran. The official
        # cmdline-tools zip is the same thing without the dependency.
        run: |
          set -euo pipefail
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - if: steps.guard.outputs.ready == 'true'
        name: Install the NDK and the SDK packages the project pins
        # Mirrors the versions the local toolchain has (compileSdk/targetSdk 36,
        # ndkVersion 28.2.13676358 in src-tauri/gen/android/app/build.gradle.kts).
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - if: steps.guard.outputs.ready == 'true'
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with: { version: 10 }

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }

      - if: steps.guard.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with: { targets: aarch64-linux-android }

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.guard.outputs.ready == 'true'
        name: Write the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/knloop-release.jks"

      - if: steps.guard.outputs.ready == 'true'
        name: Clear cached APK output
        run: rm -rf src-tauri/gen/android/app/build/outputs/apk

      - if: steps.guard.outputs.ready == 'true'
        name: Build and sign the APK
        env:
          KNLOOP_ANDROID_KEYSTORE: ${{ runner.temp }}/knloop-release.jks
          KNLOOP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KNLOOP_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KNLOOP_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # --version pins the APK to the release version: android-sign otherwise derives it
        # from the commit count, which a shallow checkout reports as 1.
        run: pnpm android:release -- --version "${{ needs.version.outputs.version }}"

      - if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 1
          path: src-tauri/gen/android/app/build/outputs/apk/*/release/knloop_*.apk

  # ── the starter vault template: Quick_Start.zip rides with every release ──────
  # The phone cannot clone (Android has no `git` binary), so it downloads this asset:
  # knloop's GETTING_STARTED_ARCHIVE_URL points at
  #   https://github.com/unclejeen/knloop_website/releases/latest/download/Quick_Start.zip
  # [knloop ADR-0263]. The file name is a contract with that constant — renaming it on
  # one side only strands the phone entry in "template download failed".
  # `--prefix=Quick_Start/` gives the archive the single top-level directory the
  # importer collapses, which is the shape GitHub's own repository archive has.
  build-template:
    name: Package the Quick_Start template
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Public repository: the default token reads it, no secret needed.
          repository: unclejeen/Quick_Start
          path: Quick_Start
          fetch-depth: 1
      - name: Zip the template
        run: |
          set -euo pipefail
          git -C Quick_Start archive --format=zip --prefix=Quick_Start/ -o "$PWD/Quick_Start.zip" HEAD
          unzip -l Quick_Start.zip
      - uses: actions/upload-artifact@v4
        with:
          name: template-zip
          if-no-files-found: error
          retention-days: 1
          path: Quick_Start.zip

  # ── flatpak: one bundle, built from this run's deb ─────────────────────────────
  # The manifest lives in the app repository and unpacks the deb into /app instead of
  # building Rust inside the SDK (see docs/linux-flatpak.md, ADR-0297). That is why this
  # job needs the linux job: the deb is its input, not a rebuild.
  build-flatpak:
    name: Build (flatpak)
    needs: [version, build-linux]
    runs-on: ubuntu-22.04
    # The action does not bring its own container: it runs flatpak-builder against whatever
    # the job provides, and its README requires this image, privileged, with the tag matching
    # the runtime in the manifest (ghcr.io/flathub-infra/flatpak-github-actions:gnome-48 for
    # org.gnome.Platform//48). Without this the job fails in CI.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPOSITORY }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.KNLOOP_READ_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: linux-bundles

      - name: Put this run's deb where the manifest expects it
        run: |
          set -euo pipefail
          deb=$(find linux-bundles -name '*.deb' -print -quit)
          [ -n "$deb" ] || { echo '::error::the linux job produced no deb'; exit 1; }
          cp "$deb" flatpak/knloop.deb
          ls -l flatpak/

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/com.knloop.app.yml
          # The bundle names the version, like every other asset, so the install page and
          # the release page can point at it without a lookup.
          bundle: knloop_${{ needs.version.outputs.version }}_linux-x86_64.flatpak
          build-bundle: true
          cache-key: flatpak-builder-${{ needs.version.outputs.version }}
          # The action uploads the bundle it just wrote, under this name: it knows where the
          # file is, while a separate step would have to guess at the action's layout. The
          # release job downloads every artifact, so this lands in artifacts/ and the *.flatpak
          # allowlist picks it up.
          upload-artifact: true
          artifact-name: flatpak-bundle

  # ── one release: every asset + a manifest that lists every platform ────────────
  release:
    name: Publish the release
    needs: [version, build-linux, build-windows, build-android, build-template, build-flatpak]
    if: ${{ always() && needs.version.result == 'success' && needs.build-linux.result == 'success' && needs.build-windows.result == 'success' && (needs.build-android.result == 'success' || needs.build-android.result == 'skipped') && needs.build-template.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Build latest.json
        # This workflow builds every platform the updater serves, so the manifest is
        # written from scratch on each run: no stale entries (an older manifest still
        # carries darwin-* from the macOS era) and nothing to merge. The local Windows
        # packaging flow must therefore NOT publish its own manifest - it would
        # replace this one with a file built outside the release pipeline.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          REPO="${{ github.repository }}"

          # download-artifact recreates the layout upload-artifact stored, so the files
          # sit under <artifact>/<dir>/. Read the signature next to the file find
          # returned; joining the basename with the artifact root does not exist
          # (that is what broke run 5's publish job).
          windows_path=$(find artifacts/windows-bundles -name '*-setup.exe' -print -quit)
          windows_setup=$(basename "$windows_path")
          windows_sig=$(cat "$windows_path.sig")

          VERSION="$VERSION" REPO="$REPO" TAG="$TAG" \
          WINDOWS_URL="https://github.com/$REPO/releases/download/$TAG/$windows_setup" \
          WINDOWS_SIG="$windows_sig" node -e '
            require("node:fs").writeFileSync("latest.json", JSON.stringify({
              version: process.env.VERSION,
              notes: "knloop " + process.env.VERSION,
              pub_date: new Date().toISOString().replace(/\.\d{3}Z$/, "Z"),
              platforms: {
                "windows-x86_64": {
                  signature: process.env.WINDOWS_SIG,
                  url: process.env.WINDOWS_URL,
                  download_url: process.env.WINDOWS_URL,
                },
              },
            }, null, 2) + "\n");
          '
          cat latest.json

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          # Recursive on purpose: flat globs matched nothing against the nested
          # download layout, so the release would have shipped without installers.
          mapfile -t assets < <(find artifacts -type f \
            \( -name '*.deb' -o -name '*.deb.sig' -o -name '*.rpm' -o -name '*.rpm.sig' \
               -o -name '*.exe' -o -name '*.exe.sig' -o -name '*.apk' -o -name '*.msix' \
               -o -name 'Quick_Start.zip' \
               -o -name '*.flatpak' \) | sort)
          assets+=(latest.json)
          printf '%s\n' "${assets[@]}"
          # Notes stay generic: this repository is public, knloop's commit subjects are not.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "knloop $VERSION" --notes "knloop $VERSION" "${assets[@]}"
          fi
          echo "### Published knloop $VERSION" >> "$GITHUB_STEP_SUMMARY"

  # ── keep the download links in articles/install.md fresh ───────────────────────
  # Asset names carry the version (knloop_0.1.0-871_linux-amd64.deb), so a link written
  # by hand goes stale on the next release — install.md was still pointing at 0.1.0-844
  # with an APK that had since been renamed. This job re-renders the marked block from
  # the release that was just published, so the install page always offers the current
  # packages (and lists every Linux variant, which the download button cannot choose).
  sync-install-links:
    name: Refresh articles/install.md download links
    needs: [version, release]
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      # node 24 on purpose: scripts/sync-install-downloads.mjs imports src/lib/downloads.ts.
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Rewrite the links from the release that was just published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-install-downloads.mjs --tag "${{ needs.version.outputs.tag }}"
      - name: Commit when the links changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- articles/install.md; then
            echo "articles/install.md 已是最新，无需提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/install.md
          git commit -m "docs(install): 同步 knloop ${{ needs.version.outputs.version }} 的下载链接"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
